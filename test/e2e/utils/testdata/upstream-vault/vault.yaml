apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-vault
  namespace: {{ .Namespace }}
  labels:
    ztwim.e2e/datastore: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-vault
  template:
    metadata:
      labels:
        app: e2e-vault
        ztwim.e2e/datastore: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.15
          args:
            - server
            - -dev
            - -dev-root-token-id=root
            - -dev-listen-address=0.0.0.0:8200
          ports:
            - containerPort: 8200
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-vault
  namespace: {{ .Namespace }}
  labels:
    ztwim.e2e/datastore: vault
spec:
  selector:
    app: e2e-vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
