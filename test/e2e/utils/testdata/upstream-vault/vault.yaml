apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-vault-auth-reviewer
  namespace: {{ .Namespace }}
  labels:
    ztwim.e2e/datastore: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-vault-auth-reviewer-{{ .Namespace }}
  labels:
    ztwim.e2e/datastore: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: e2e-vault-auth-reviewer
    namespace: {{ .Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-vault
  namespace: {{ .Namespace }}
  labels:
    ztwim.e2e/datastore: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-vault
  template:
    metadata:
      labels:
        app: e2e-vault
        ztwim.e2e/datastore: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.15
          # Bypass docker-entrypoint.sh (setcap/mlock) so Vault runs on restricted SCC.
          command:
            - vault
          args:
            - server
            - -dev
            - -dev-root-token-id=root
            - -dev-listen-address=0.0.0.0:8200
          ports:
            - containerPort: 8200
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vault-home
              mountPath: /home/vault
      volumes:
        - name: vault-home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-vault
  namespace: {{ .Namespace }}
  labels:
    ztwim.e2e/datastore: vault
spec:
  selector:
    app: e2e-vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
