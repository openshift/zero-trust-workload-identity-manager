apiVersion: v1
kind: Secret
metadata:
  name: e2e-postgres-credentials
  namespace: {{ .Namespace }}
  labels:
    ztwim.e2e/datastore: postgres
type: Opaque
stringData:
  password: spire-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-postgres
  namespace: {{ .Namespace }}
  labels:
    ztwim.e2e/datastore: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-postgres
  template:
    metadata:
      labels:
        app: e2e-postgres
        ztwim.e2e/datastore: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: spire
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: e2e-postgres-credentials
                  key: password
            - name: POSTGRES_DB
              value: spire
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-postgres
  namespace: {{ .Namespace }}
  labels:
    ztwim.e2e/datastore: postgres
spec:
  selector:
    app: e2e-postgres
  ports:
    - name: postgres
      port: 5433
      targetPort: 5432
