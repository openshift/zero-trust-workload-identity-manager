apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ztwim-sys-spire-agent-egress-allow-all
  namespace: zero-trust-workload-identity-manager
  labels:
    app.kubernetes.io/managed-by: zero-trust-workload-identity-manager
    app.kubernetes.io/part-of: zero-trust-workload-identity-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spire-agent
  policyTypes:
    - Egress
  egress:
    # Allow-all egress is intentional for GA (SPIRE-774): agents must reach the SPIRE server, kube API,
    # DNS, and node-local paths that vary by topology. podSelector above is limited to spire-agent pods
    # only. For narrower egress, set managedNetworkPolicy: "false" and apply samples from
    # config/samples/network-policies/ or use cluster AdminNetworkPolicy per platform guidance.
    - {}
