version: "2"

run:
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    gocyclo:
      # Existing helpers in resource_comparison.go are above the default 30.
      min-complexity: 41
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: (api/.*|cmd/.*)
      - linters:
          - dupl
          - lll
        path: pkg/.*
      # Tests and e2e suites generate most style noise without catching production defects.
      - linters:
          - dupl
          - errcheck
          - goconst
          - gocyclo
          - lll
          - prealloc
          - staticcheck
        path: (.+_test\.go$|test/.*)
      # Known controller-runtime / apimachinery deprecations deferred to dedicated upgrades.
      - linters:
          - staticcheck
        text: "SA1019: scheme.Builder is deprecated"
      - linters:
          - staticcheck
        text: "SA1019: mgr.GetEventRecorderFor is deprecated"
      - linters:
          - staticcheck
        text: "Requeue is deprecated"
      - linters:
          - staticcheck
        text: 'SA1019: "k8s.io/utils/pointer" is deprecated'
    paths:
      - third_party$
      - builtin$
      - examples$
      - vendor$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - vendor$
      - .+_test\.go$
      - test/.*
