# Reference only — tailor namespace/port to your external datastore Service or Endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ztwim-sys-spire-server-database-egress
  namespace: zero-trust-workload-identity-manager
  labels:
    app.kubernetes.io/managed-by: zero-trust-workload-identity-manager
    app.kubernetes.io/part-of: zero-trust-workload-identity-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spire-server
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spire-datastore
      ports:
        - port: 5432
          protocol: TCP
