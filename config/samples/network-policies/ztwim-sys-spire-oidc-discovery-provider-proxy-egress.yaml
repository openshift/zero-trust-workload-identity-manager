# Reference only — outbound HTTPS (e.g. proxy) is not managed by operator NetworkPolicies today.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ztwim-sys-spire-oidc-discovery-provider-proxy-egress
  namespace: zero-trust-workload-identity-manager
  labels:
    app.kubernetes.io/managed-by: zero-trust-workload-identity-manager
    app.kubernetes.io/part-of: zero-trust-workload-identity-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spire-oidc-discovery-provider
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-config
      ports:
        - port: 443
          protocol: TCP
